<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ad Astra Web Clipper</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ec;
        --card: #ffffff;
        --text: #13201f;
        --muted: #5f6f6c;
        --accent: #0f766e;
        --border: rgba(29, 78, 72, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      main {
        width: min(560px, calc(100vw - 32px));
        padding: 40px 32px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card);
        box-shadow: 0 22px 50px rgba(15, 23, 42, 0.08);
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 26px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      a.button {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 12px;
        background: linear-gradient(135deg, #0f766e, #14b8a6);
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Ad Astra Web Clipper</p>
      <h1>Chrome extension for clipping articles to Ad Astra.</h1>
      <p>
        Ad Astra Web Clipper extracts the current article and saves it to your
        own Ad Astra service.
      </p>
      <a class="button" href="./privacy-policy.html">Privacy policy</a>
    </main>
  </body>
</html>
